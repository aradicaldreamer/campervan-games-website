<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Merge Kitchen</title>
  <!-- viewport-fit=cover lets the game run under the notch in a home-screen launch; the
       iframe below keeps to the safe area so nothing important sits under it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#54321a">

  <!-- iOS home-screen ("web clip") settings. Safari reads these from THIS page, which is why the
       page exists: itch's project page declares none, so a clip of it gets a screenshot icon. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Merge Kitchen">

  <!-- Android / desktop -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <style>
    html, body { margin: 0; height: 100%; background: #54321a; overflow: hidden; }
    /* Fill the screen but respect the notch / home indicator. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      left: env(safe-area-inset-left, 0);
      right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0);
      width: auto; height: auto;
      border: 0; background: #54321a;
    }
    #fallback { color: #f5dcb0; font: 16px system-ui, sans-serif; text-align: center; padding-top: 40vh; }
    #fallback a { color: #f7c458; }
  </style>
</head>
<body>
  <!-- The game's own HTML on itch's CDN, not the itch.io/embed-upload widget: the widget is a
       desktop layout with its own toolbar and does not fill a phone screen. The path is
       <upload id>-<build id>, and the build id changes on every release, so tools/release.sh in the
       game repo rewrites this src after each itch push. Do not edit the URL by hand. -->
  <iframe id="game" src="https://html-classic.itch.zone/html/19108637-1951152/index.html" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <noscript><div id="fallback">Merge Kitchen needs JavaScript. <a href="https://aradicaldreamer.itch.io/mergekitchen">Play on itch.io</a></div></noscript>
</body>
</html>
